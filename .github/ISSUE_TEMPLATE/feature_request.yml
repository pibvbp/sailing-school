name: Feature request
description: Suggest an improvement to the app, the physics, the graphics or the docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! For a new lesson, please use the **Lesson idea** form instead.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see, and why?
      description: Describe the problem it solves or what it would help people learn.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: A sketch of the behaviour, the controls or the look. Links to references or photos are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Lessons
        - Free sail
        - Sail lab
        - Physics
        - Graphics
        - Overlays and teaching visuals
        - Sound
        - Controls and interface
        - Performance
        - Documentation
        - Something else
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this.
